# Home "Work" section. Order = display order.
# blurb is Markdown (bold with **…**, blank line = new paragraph).
# variant: dark (Doconomy hero card) | light. shots bleed off the card edge.

- client: Doconomy
  title: |
    Bank Embedded
    Goal Based Savings
  variant: dark
  cta:
    label: Read case
    href: /doconomy/
  blurb: >-
    Turning a B2C product into a white-labeled B2B2C SaaS product embedded
