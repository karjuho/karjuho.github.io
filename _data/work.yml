    kitchen's fridge door.
  shots:
    - { src: /assets/images/work/juusto-a.jpg, w: 462,  h: 1000, pos: back }
    - { src: /assets/images/work/juusto-b.jpg, w: 1000, h: 625,  pos: front }

- client: Stora Enso
  title: Design System
  variant: light
  blurb: >-
    Redesigning the world's oldest company's Design System and facilitating the
    design-system processes in a multi-product environment across cross-functional
    international teams. I updated everything from UI components to colours and
    typography in cooperation with product teams, rebuilt the documentation and
    coded the animation by hand with CSS.
  shots:
    - { src: /assets/images/work/storaenso-a.jpg, w: 1000, h: 542, pos: back }
    - { src: /assets/images/work/storaenso-b.jpg, w: 1000, h: 688, pos: front }

- client: Bromma
  title: IoT Monitoring
  variant: light
