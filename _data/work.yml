# Home "Work" section. Order = display order.
# blurb is Markdown (bold with **…**, blank line = new paragraph).
# variant: dark (Doconomy hero card) | light.
#
# shots: the screenshot stack on the right. Position/rotation live in CSS
# (.work-card__shot--N) straight from Figma 16:878; here we only carry the
# file, its intrinsic size, and how the image sits inside its frame:
#   fit: cover (default) | contain | top | strip
# Images are exported at 2x their display size, so they stay crisp.

- client: Doconomy
  title: |
    Bank Embedded
    Goal Based Savings
  variant: dark
  cta:
    label: Read case
    href: /doconomy/
  blurb: >-
    Turning a B2C product into a white-labeled B2B2C SaaS product embedded
    inside consumer banking apps. Working in cross-functional teams, my
    responsibility has been to lead product design for a product with over
    **100,000 monthly users**.
  shots:
    - { src: /assets/images/work/doconomy-calendar.png, w: 467, h: 490,  alt: "Doconomy date picker" }
    - { src: /assets/images/work/doconomy-phone.jpg,    w: 508, h: 1662, alt: "Doconomy goal-based savings screen" }
    - { src: /assets/images/work/doconomy-cards.png,    w: 413, h: 359,  alt: "Doconomy savings goal cards" }

