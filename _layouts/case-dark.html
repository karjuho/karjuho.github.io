---
layout: default
---

<main class="case-page" id="main" tabindex="-1">

  <!-- The hero wash: a base gradient plus the two light sweeps (Figma
       Ellipse 2170 / 2171), split out of hero-bg.svg into their own files
       so they can drift the way the hero card's do on the home page. -->
  <div class="case-page__bg" aria-hidden="true">
    <span class="case-page__ray case-page__ray--a"></span>
    <span class="case-page__ray case-page__ray--b"></span>
  </div>

  <header class="case-topbar">
    <a class="case-back" href="{{ "/" | relative_url }}#work">
      <span class="case-back__icon" aria-hidden="true"></span>
      <span class="profile-brand">
        <span class="profile-photo">
          <img src="{{ "/assets/images/juho-profile.jpg" | relative_url }}"
               width="48" height="48" alt="">
        </span>
        <span class="profile-id">
          <span class="profile-name">Juho Karhu</span>
          <span class="profile-role">Product Designer</span>
        </span>
      </span>
      <span class="visually-hidden">Back to the front page</span>
    </a>
  </header>

  {{ content }}

</main>
