<title>Findoor konfiguraattori</title>
<style>
:root{--bg:#eef0f2;--panel:#ffffff;--text:#16202e;--muted:#667080;--line:#dde2e8;--accent:#143262;--accent-text:#fff;--blue:#0091cc;color-scheme:light}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]){--bg:#121821;--panel:#1b2330;--text:#eef3fa;--muted:#9fb0c6;--line:#2b3747;--accent:#7cbcf0;--accent-text:#0a1220;color-scheme:dark}}
:root[data-theme="dark"]{--bg:#121821;--panel:#1b2330;--text:#eef3fa;--muted:#9fb0c6;--line:#2b3747;--accent:#7cbcf0;--accent-text:#0a1220;color-scheme:dark}
*{box-sizing:border-box}
html,body{height:100%;margin:0}
body{background:var(--bg);color:var(--text);font-family:-apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,Helvetica,Arial,sans-serif;display:flex;flex-direction:column;overflow:hidden}
button{font:inherit;color:inherit}
#stage{position:relative;flex:1;min-height:0;touch-action:none;overflow:hidden;background:linear-gradient(#cfdbe6,#eef1f4 60%)}
#stage canvas{display:block;width:100%;height:100%}
.fl{position:absolute;z-index:5}
.chip{display:inline-flex;align-items:center;gap:6px;padding:8px 14px;border-radius:980px;border:1px solid var(--line);background:color-mix(in srgb,var(--panel) 92%,transparent);backdrop-filter:blur(10px);-webkit-backdrop-filter:blur(10px);color:var(--text);font-size:14px;font-weight:600;text-decoration:none;cursor:pointer;box-shadow:0 2px 10px rgba(0,0,0,.08)}
.chip:hover{border-color:var(--accent)}
#home{left:12px;top:12px}
#tools{left:50%;top:12px;transform:translateX(-50%);display:flex;gap:4px;padding:5px;border-radius:16px;border:1px solid var(--line);background:color-mix(in srgb,var(--panel) 94%,transparent);backdrop-filter:blur(10px);-webkit-backdrop-filter:blur(10px);box-shadow:0 4px 18px rgba(0,0,0,.1);max-width:calc(100% - 24px);overflow-x:auto}
#tools button{display:flex;flex-direction:column;align-items:center;gap:3px;min-width:64px;padding:7px 10px;border:0;border-radius:11px;background:transparent;font-size:12px;font-weight:600;cursor:pointer;color:var(--muted)}
#tools button svg{width:22px;height:22px}
#tools button:hover{color:var(--text);background:color-mix(in srgb,var(--accent) 8%,transparent)}
#tools button[aria-pressed="true"]{background:var(--accent);color:var(--accent-text)}
#tools .sep{width:1px;background:var(--line);margin:6px 2px}
#tip{left:50%;top:84px;transform:translateX(-50%);font-size:13px;font-weight:600;padding:7px 14px;border-radius:980px;background:rgba(20,50,98,.92);color:#fff;white-space:nowrap;pointer-events:none;max-width:calc(100% - 24px);overflow:hidden;text-overflow:ellipsis}
#cam{right:12px;bottom:12px;display:flex;flex-direction:column;gap:6px}
#cam button{width:40px;height:40px;border-radius:12px;border:1px solid var(--line);background:color-mix(in srgb,var(--panel) 92%,transparent);cursor:pointer;font-size:18px;font-weight:700;display:grid;place-items:center}
#cam button svg{width:20px;height:20px}
#help{left:12px;bottom:12px;font-size:12px;color:var(--muted);background:color-mix(in srgb,var(--panel) 80%,transparent);padding:6px 10px;border-radius:10px}
#back{left:12px;top:12px;display:none}
#fhead{left:50%;top:12px;transform:translateX(-50%);display:none;font-size:15px;font-weight:700;padding:9px 18px}
.openbar{left:50%;bottom:16px;transform:translateX(-50%);display:none;align-items:center;gap:14px;padding:7px 16px 7px 7px;border-radius:980px;background:color-mix(in srgb,var(--panel) 92%,transparent);backdrop-filter:blur(12px);-webkit-backdrop-filter:blur(12px);border:1px solid var(--line);box-shadow:0 6px 20px rgba(0,0,0,.12);white-space:nowrap}
.openbar .obtn{border:0;border-radius:980px;padding:10px 20px;background:var(--accent);color:var(--accent-text);font-size:15px;font-weight:600;cursor:pointer;min-width:112px}
.openbar input{width:140px;min-width:90px;accent-color:var(--accent)}
.openbar b{font-size:13px;color:var(--muted);font-variant-numeric:tabular-nums;min-width:38px;text-align:right}
.lbl3d{position:absolute;z-index:4;transform:translate(-50%,-100%);pointer-events:none;font-size:12px;font-weight:700;white-space:nowrap}
.badge{display:grid;place-items:center;min-width:26px;height:26px;padding:0 7px;border-radius:13px;background:var(--accent);color:var(--accent-text);box-shadow:0 2px 6px rgba(0,0,0,.25);pointer-events:auto;cursor:pointer}
.len{background:#fff;color:#143262;border:1px solid #143262;border-radius:8px;padding:3px 8px}
#toast{left:50%;bottom:24px;transform:translateX(-50%);padding:10px 16px;border-radius:12px;background:#143262;color:#fff;font-size:14px;font-weight:600;opacity:0;transition:opacity .3s;pointer-events:none}
#toast.on{opacity:1}

#panel>*{flex-shrink:0}
#panel{background:var(--panel);border-top:1px solid var(--line);padding:16px;overflow-y:auto;max-height:46vh;display:flex;flex-direction:column;gap:14px}

@media (prefers-color-scheme:dark){:root:not([data-theme="light"]) .brand .logo{filter:brightness(0) invert(1)}}
:root[data-theme="dark"] .brand .logo{filter:brightness(0) invert(1)}
.brand span{font-size:13px;color:var(--muted);font-weight:600}
h3{margin:0;font-size:12px;letter-spacing:.06em;text-transform:uppercase;color:var(--muted);padding-top:12px;border-top:1px solid var(--line)}
h2{margin:0;font-size:20px}
.muted{color:var(--muted);font-size:13px;line-height:1.5;margin:0}
label.row,.lblr{display:flex;justify-content:space-between;font-size:13px;color:var(--muted);margin-bottom:6px}
label.row b{color:var(--text);font-variant-numeric:tabular-nums}
input[type=range]{width:100%;accent-color:var(--accent)}
.seg{display:flex;border:1px solid var(--line);border-radius:10px;overflow:hidden}
.seg button{flex:1;padding:9px 6px;border:0;background:transparent;font-size:14px;cursor:pointer}
.seg button+button{border-left:1px solid var(--line)}
.seg button[aria-pressed="true"]{background:var(--accent);color:var(--accent-text)}
.swatches{display:flex;flex-wrap:wrap;gap:8px}
.sw{width:30px;height:30px;border-radius:50%;border:2px solid var(--line);cursor:pointer;padding:0}
.sw[aria-pressed="true"]{outline:2px solid var(--accent);outline-offset:2px}
.cname{font-size:13px;margin-top:6px}
.chk{display:flex;align-items:center;gap:8px;font-size:14px;cursor:pointer}
.chk input{accent-color:var(--accent);width:18px;height:18px}
.btn{width:100%;padding:11px 14px;border:1px solid var(--accent);border-radius:10px;background:var(--accent);color:var(--accent-text);font-size:15px;font-weight:600;cursor:pointer}
.btn.ghost{background:transparent;color:var(--text);border-color:var(--line)}
.btn.danger{background:transparent;color:#c0392b;border-color:color-mix(in srgb,#c0392b 40%,var(--line))}
.btns{display:flex;gap:8px}
.dlist{display:flex;flex-direction:column;gap:6px}
.ditem{display:flex;align-items:center;gap:10px;padding:9px 10px;border:1px solid var(--line);border-radius:10px;background:transparent;cursor:pointer;text-align:left;width:100%}
.ditem:hover{border-color:var(--accent)}
.ditem .n{flex:none;display:grid;place-items:center;width:26px;height:26px;border-radius:13px;background:var(--accent);color:var(--accent-text);font-size:12px;font-weight:700}
.ditem .t{flex:1;font-size:13px;line-height:1.35}
.ditem .t b{display:block;font-size:14px}
.ditem .c{flex:none;width:18px;height:18px;border-radius:50%;border:1px solid var(--line)}
.empty{font-size:13px;color:var(--muted);padding:10px;border:1px dashed var(--line);border-radius:10px;text-align:center}
dl{margin:0;display:grid;grid-template-columns:auto 1fr;gap:4px 14px;font-size:13px}
dt{color:var(--muted)}dd{margin:0;text-align:right}
.help{font-size:13px;color:var(--muted);line-height:1.5;padding-top:12px;border-top:1px solid var(--line);margin:0}
.help a{color:var(--text);font-weight:600;text-decoration:none}
dialog{border:1px solid var(--line);border-radius:14px;background:var(--panel);color:var(--text);padding:20px;width:min(560px,92vw);max-height:88vh;overflow-y:auto}
dialog::backdrop{background:rgba(0,0,0,.45)}
dialog h2{margin:0 0 4px;font-size:18px}
.dsum{margin:0 0 14px;font-size:13px;color:var(--muted);display:flex;flex-direction:column;gap:6px}
.dsum div{padding:8px 10px;border:1px solid var(--line);border-radius:8px}
.dsum b{color:var(--text)}
.f{display:grid;grid-template-columns:1fr 1fr;gap:10px}
.f label{display:flex;flex-direction:column;gap:4px;font-size:12px;color:var(--muted)}
.f label.full{grid-column:1/-1}
.f input,.f textarea{font:inherit;font-size:14px;padding:8px 10px;border:1px solid var(--line);border-radius:8px;background:var(--bg);color:var(--text)}
.acts{display:flex;gap:10px;margin-top:14px}
@media (min-width:900px){body{flex-direction:row}#panel{width:380px;max-height:none;border-top:0;border-left:1px solid var(--line)}}
@media (max-width:700px){#tools{top:58px}#tools button{min-width:52px;padding:6px 6px;font-size:11px}#help{display:none}#tip{top:126px;font-size:12px}.f{grid-template-columns:1fr}#home .t{display:none}#fhead{top:60px}}
body.demo-bare #panel,body.demo-bare .fl,body.demo-bare #labels{display:none!important}
body.demo-ui #help,body.demo-ui #home,body.demo-ui #back,body.demo-ui #cam,body.demo-ui #toast{display:none!important}
body.demo-bare,body.demo-bare #stage{background:#e9e5df!important}
</style>
</head>
<body>
<div id="stage">
  <a class="fl chip" id="home" href="/findoor/kotisivu/">← <span class="t">Etusivulle</span></a>
  <button class="fl chip" id="back" type="button">← Takaisin rakennukseen</button>
  <div class="fl chip" id="fhead"></div>
  <div class="fl" id="tools" role="toolbar" aria-label="Työkalut">
    <button data-tool="select" aria-pressed="true" title="Valitse ja siirrä (V)"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linejoin="round"><path d="M5 3l14 8-6 2-3 6Z"/></svg>Valitse</button>
    <button data-tool="room" aria-pressed="false" title="Piirrä huone (R)"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><rect x="4" y="5" width="16" height="14" rx="1"/></svg>Huone</button>
    <button data-tool="wall" aria-pressed="false" title="Piirrä seinä (W)"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round"><path d="M4 19 12 6l8 10"/><circle cx="4" cy="19" r="1.6" fill="currentColor"/><circle cx="12" cy="6" r="1.6" fill="currentColor"/><circle cx="20" cy="16" r="1.6" fill="currentColor"/></svg>Seinä</button>
    <button data-tool="door" aria-pressed="false" title="Lisää ovi (D)"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linejoin="round"><path d="M3 4h18"/><path d="M4 5l4 1.5v13L4 20Z"/><path d="M8 6.5 12 5v15l-4-.5"/><path d="M12 5l4 1.5v13L12 20"/><path d="M16 6.5 20 5v15l-4-.5"/></svg>Ovi</button>
    <button data-tool="erase" aria-pressed="false" title="Poista (X)"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M4 7h16"/><path d="M9 7V4h6v3"/><path d="M6 7l1 13h10l1-13"/></svg>Poista</button>
    <span class="sep"></span>
    <button data-act="undo" title="Kumoa (Ctrl+Z)"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M9 14 4 9l5-5"/><path d="M4 9h10a6 6 0 0 1 0 12h-3"/></svg>Kumoa</button>
  </div>
  <div class="fl" id="tip"></div>
  <div class="fl" id="cam">
    <button type="button" data-cam="zin" title="Lähemmäs">+</button>
    <button type="button" data-cam="zout" title="Kauemmas">−</button>
    <button type="button" data-cam="rl" title="Kierrä vasemmalle"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round"><path d="M3 12a9 9 0 1 0 3-6.7"/><path d="M3 4v5h5"/></svg></button>
    <button type="button" data-cam="rr" title="Kierrä oikealle"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round"><path d="M21 12a9 9 0 1 1-3-6.7"/><path d="M21 4v5h-5"/></svg></button>
    <button type="button" data-cam="fit" title="Näytä koko rakennus"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round"><path d="M4 9V4h5M20 9V4h-5M4 15v5h5M20 15v5h-5"/></svg></button>
  </div>
  <div class="fl" id="help">Vedä: kierrä · Oikea painike tai kaksi sormea: siirrä · Rulla: zoomaa</div>
  <div class="fl openbar" id="openbar"><button class="obtn" id="toggle" type="button">Avaa ovi</button><input id="o" type="range" min="0" max="100" step="1" value="0" aria-label="Avautumisaste"><b id="vo">0 %</b></div>
  <div class="fl" id="toast"></div>
  <div id="labels"></div>
</div>

<aside id="panel"></aside>

<dialog id="dlg">
  <h2>Tarjouspyyntö</h2>
  <div class="dsum" id="dsum"></div>
  <div class="f" id="form"></div>
  <label class="chk" style="margin-top:12px"><input type="checkbox" id="gdpr"> Hyväksyn henkilötietojen käytön tietosuojaselosteen mukaisesti</label>
  <div class="acts"><button class="btn ghost" id="cancel" type="button">Peruuta</button><button class="btn" id="send" type="button">Lähetä tarjouspyyntö</button></div>
  <p class="muted" id="thanks" style="display:none;margin-top:12px">Kiitos, olemme vastaanottaneet tarjouspyyntönne. (Demo, mitään ei lähetetä.)</p>
</dialog>

}

  $('back').style.display='inline-flex';$('openbar').style.display='flex';$('fhead').style.display='inline-flex';$('help').textContent='Vedä: kierrä ovea · Rulla: zoomaa · Esc: takaisin';

  h+='<div><h2>Rakennus</h2><p class="muted" style="margin-top:4px">Piirrä rakennuksen seinät ja lisää niihin ovet. Klikkaa ovea, niin pääset muokkaamaan sitä.</p></div>';
  if(tool==='door'){h+='<h3>Lisättävä ovi</h3><div class="seg" id="dtype">'+Object.keys(TYPES).map(function(k){return '<button data-v="'+k+'" aria-pressed="'+(k===doorType)+'">'+TYPES[k].name+'</button>'}).join('')+'</div><p class="muted">Oletuskoko '+TYPES[doorType].w+' × '+Math.min(TYPES[doorType].h,Math.round(maxDoorH()*10)*100)+' mm. Voit muuttaa sitä lisäämisen jälkeen.</p>'}
  h+='<h3>Seinät</h3><div><label class="row">Seinän korkeus <b id="vwh">'+B.wallH.toFixed(1).replace('.',',')+' m</b></label><input id="wh" type="range" min="3" max="12" step="0.5" value="'+B.wallH+'"></div>';
  h+='<h3>Ovet ('+B.doors.length+')</h3><div class="dlist">';
  if(!B.doors.length)h+='<div class="empty">Ei vielä ovia. Valitse yläpalkista <b>Ovi</b> ja klikkaa seinää.</div>';
  B.doors.forEach(function(d,i){h+='<button class="ditem" data-id="'+d.id+'"><span class="n">'+(i+1)+'</span><span class="t"><b>'+TYPES[d.type].name+'</b>'+d.w+' × '+d.h+' mm</span><span class="c" style="background:'+PALETTE[d.out][1]+'"></span></button>'});
  h+='</div>';
  h+='<button class="btn" id="quote"'+(B.doors.length?'':' disabled')+'>Pyydä tarjous kaikista ovista</button>';
  h+='<h3>Pohja</h3><div class="btns"><button class="btn ghost" id="tpl">Paloasema-malli</button><button class="btn ghost" id="clr">Tyhjennä</button></div>';
  h+=helpLine;panel.innerHTML=h;
  panel.querySelectorAll('#dtype button').forEach(function(b){b.addEventListener('click',function(){doorType=b.dataset.v;renderPanel()})});
  $('wh').addEventListener('input',function(e){begin();B.wallH=parseFloat(e.target.value);var mh=Math.round(maxDoorH()*10)*100;B.doors.forEach(function(d){if(d.h>mh)d.h=Math.max(TYPES[d.type].minH,mh)});$('vwh').textContent=B.wallH.toFixed(1).replace('.',',')+' m';rebuild()});
  $('wh').addEventListener('change',function(){end();save();renderPanel()});
  panel.querySelectorAll('.ditem').forEach(function(b){b.addEventListener('click',function(){enterFocus(parseInt(b.dataset.id,10))})});
  $('quote').addEventListener('click',openQuote);
  $('tpl').addEventListener('click',function(){snap();B=template();rebuild();save();fit(true);renderPanel();toast('Paloasema-malli palautettu')});
  $('clr').addEventListener('click',function(){snap();B={wallH:B.wallH,walls:[],doors:[],next:B.next};rebuild();save();renderPanel();setTool('room');toast('Tyhjennetty. Piirrä uusi huone.')});
}
function renderDoorPanel(){
  var d=doorById(focusId);if(!d){exitFocus();return}
  var i=B.doors.indexOf(d)+1,T=TYPES[d.type],w=wallById(d.wall),Lmax=Math.min(T.maxW,Math.floor((wlen(w)-0.4)*10)*100),Hmax=Math.min(T.maxH,Math.round(maxDoorH()*10)*100);
  $('fhead').textContent='Ovi '+i+' · '+T.name;
  var h=brand+'<div><h2>Ovi '+i+'</h2><p class="muted" style="margin-top:4px">'+doorSummary(d)+'</p></div>';
  h+='<h3>Tyyppi</h3><div class="seg" id="ftype">'+Object.keys(TYPES).map(function(k){return '<button data-v="'+k+'" aria-pressed="'+(k===d.type)+'">'+TYPES[k].name+'</button>'}).join('')+'</div>';
  h+='<h3>Mitat</h3><div><label class="row">Leveys <b id="vw">'+d.w+' mm</b></label><input id="fw" type="range" min="'+T.minW+'" max="'+Math.max(T.minW,Lmax)+'" step="100" value="'+d.w+'"></div>';
  h+='<div><label class="row">Korkeus <b id="vh">'+d.h+' mm</b></label><input id="fh" type="range" min="'+T.minH+'" max="'+Math.max(T.minH,Hmax)+'" step="100" value="'+d.h+'"></div>';
  h+='<h3>Väri</h3><div><div class="lblr">Ulkopuoli</div><div class="swatches" id="swOut"></div><div class="cname">'+PALETTE[d.out][0]+'</div></div><div><div class="lblr">Sisäpuoli</div><div class="swatches" id="swIn"></div><div class="cname">'+PALETTE[d.inn][0]+'</div></div>';
  h+='<h3>Varusteet</h3><div><div class="lblr">Ikkunat</div><div class="seg" id="fwin">'+[['none','Ei'],['top','Yläosa'],['full','Täyslasi']].map(function(o){return '<button data-v="'+o[0]+'" aria-pressed="'+(o[0]===d.win)+'">'+o[1]+'</button>'}).join('')+'</div></div>';
  if(d.type==='liuku'){var sd=slideDir(d);h+='<div><div class="lblr">Liukusuunta (ulkoa katsottuna)</div><div class="seg" id="fslide"><button data-v="-1" aria-pressed="'+(sd===-1)+'">Vasemmalle</button><button data-v="1" aria-pressed="'+(sd===1)+'">Oikealle</button></div></div>'}
  if(d.type!=='karmi')h+='<label class="chk"><input type="checkbox" id="fwalk"'+(d.walk?' checked':'')+'> Käyntiovi</label>';
  h+='<label class="chk"><input type="checkbox" id="fei"'+(d.ei30?' checked':'')+'> Palo-ovi EI30</label>';
  if(d.type!=='karmi')h+='<label class="chk"><input type="checkbox" id="fmot"'+(d.motor?' checked':'')+'> Moottori ja kauko-ohjain</label>';
  h+='<h3>Yhteenveto</h3><dl>'+doorRows(d).map(function(r){return '<dt>'+r[0]+'</dt><dd>'+esc(r[1])+'</dd>'}).join('')+'</dl>';
  h+='<div class="btns"><button class="btn ghost" id="fflip">Käännä ulkopuoli</button><button class="btn danger" id="fdel">Poista ovi</button></div>';
  h+='<button class="btn" id="fdone">Valmis, takaisin rakennukseen</button>'+helpLine;
  panel.innerHTML=h;
  function upd(fn,rebuildPanel){begin();fn();rebuild();if(rebuildPanel){end();save();renderPanel()}}
  panel.querySelectorAll('#ftype button').forEach(function(b){b.addEventListener('click',function(){var k=b.dataset.v;if(k===d.type)return;snap();var T2=TYPES[k];d.type=k;d.w=Math.max(T2.minW,Math.min(T2.maxW,k==='karmi'||d.w<T2.minW?T2.w:d.w));d.h=Math.max(T2.minH,Math.min(T2.maxH,Math.min(Math.round(maxDoorH()*10)*100,k==='karmi'?T2.h:d.h)));
    var ww=wallById(d.wall);if(openW(d)>wlen(ww)-0.4)d.w=Math.max(T2.minW,Math.floor((wlen(ww)-0.5)*10)*100);d.t=clampT(ww,d.t,openW(d));if(overlaps(d.wall,d.t,openW(d),d.id)){B=JSON.parse(hist.pop());toast('Tämä ovityyppi ei mahdu viereisten ovien väliin');rebuild();renderPanel();return}if(k==='karmi'){d.walk=false;d.motor=false}rebuild();save();renderPanel();refocus()})});
  $('fw').addEventListener('input',function(e){begin();var nw=parseInt(e.target.value,10),old=d.w;d.w=nw;var ww=wallById(d.wall);d.t=clampT(ww,d.t,openW(d));if(overlaps(d.wall,d.t,openW(d),d.id)){d.w=old;e.target.value=old;toast('Ovi osuisi viereiseen oveen');return}$('vw').textContent=d.w+' mm';rebuild()});
  $('fh').addEventListener('input',function(e){begin();d.h=parseInt(e.target.value,10);$('vh').textContent=d.h+' mm';rebuild()});
  ['fw','fh'].forEach(function(k){$(k).addEventListener('change',function(){end();save();renderPanel()})});
  [['swOut','out'],['swIn','inn']].forEach(function(p){var wrap=$(p[0]);PALETTE.forEach(function(c,j){var b=document.createElement('button');b.className='sw';b.style.background=c[1];b.title=c[0];b.setAttribute('aria-label',c[0]);b.setAttribute('aria-pressed',j===d[p[1]]?'true':'false');
    b.addEventListener('click',function(){snap();d[p[1]]=j;rebuild();save();renderPanel();turnTo(p[1]==='inn')});wrap.appendChild(b)})});
  panel.querySelectorAll('#fslide button').forEach(function(b){b.addEventListener('click',function(){snap();d.slide=parseInt(b.dataset.v,10);rebuild();save();renderPanel()})});
  panel.querySelectorAll('#fwin button').forEach(function(b){b.addEventListener('click',function(){snap();d.win=b.dataset.v;rebuild();save();renderPanel()})});
  [['fwalk','walk'],['fei','ei30'],['fmot','motor']].forEach(function(p){var el=$(p[0]);if(el)el.addEventListener('change',function(){snap();d[p[1]]=el.checked;rebuild();save();renderPanel()})});
  $('fflip').addEventListener('click',function(){snap();d.flip=!d.flip;rebuild();save();refocus()});
  $('fdel').addEventListener('click',function(){snap();B.doors=B.doors.filter(function(o){return o.id!==d.id});exitFocus();rebuild();save();renderPanel();toast('Ovi poistettu')});
  $('fdone').addEventListener('click',exitFocus);
}
function refocus(){var id=focusId;if(id){var r=RT[id],d=doorById(id);if(r&&d)goal={tx:r.c[0],ty:d.h/2000,tz:r.c[1],yaw:shortYaw(cam.yaw,Math.atan2(r.n[0],r.n[1])+0.35),pitch:0.12,dist:Math.max(d.w/1000*(d.type==='liuku'?2:1),d.h/1000)*1.9+3}}}
function turnTo(inside){var r=RT[focusId];if(!r)return;var a=Math.atan2(r.n[0],r.n[1])+(inside?Math.PI:0)+0.35;goal={tx:cam.tx,ty:cam.ty,tz:cam.tz,yaw:shortYaw(cam.yaw,a),pitch:cam.pitch,dist:cam.dist}}

// ---------- quote ----------
$('form').innerHTML=FIELDS.map(function(f){var cls=f[1]==='full'?' class="full"':'';var inp=f[2]==='textarea'?'<textarea rows="3" maxlength="500"></textarea>':'<input type="text">';return '<label'+cls+'>'+f[0]+inp+'</label>'}).join('');
function openQuote(){$('thanks').style.display='none';$('dsum').innerHTML='<span>'+B.doors.length+' ovea rakennukseen:</span>'+B.doors.map(function(d,i){return '<div><b>Ovi '+(i+1)+': '+TYPES[d.type].name+'</b><br>'+doorRows(d).slice(1).map(function(r){return r[0]+': '+esc(r[1])}).join(' · ')+'</div>'}).join('');$('dlg').showModal()}
$('cancel').addEventListener('click',function(){$('dlg').close()});
$('send').addEventListener('click',function(){if(!$('gdpr').checked){$('gdpr').focus();return}$('thanks').style.display='block'});

// ---------- toolbar, keys, camera buttons ----------
document.querySelectorAll('#tools [data-tool]').forEach(function(b){b.addEventListener('click',function(){setTool(b.dataset.tool)})});
document.querySelector('#tools [data-act="undo"]').addEventListener('click',undo);
document.querySelectorAll('#cam button').forEach(function(b){b.addEventListener('click',function(){var a=b.dataset.cam;goal=null;
  if(a==='zin')cam.dist=Math.max(4,cam.dist*0.8);else if(a==='zout')cam.dist=Math.min(250,cam.dist*1.25);else if(a==='rl')goal={tx:cam.tx,ty:cam.ty,tz:cam.tz,yaw:cam.yaw+Math.PI/4,pitch:cam.pitch,dist:cam.dist};else if(a==='rr')goal={tx:cam.tx,ty:cam.ty,tz:cam.tz,yaw:cam.yaw-Math.PI/4,pitch:cam.pitch,dist:cam.dist};else if(a==='fit'){if(focusId)refocus();else fit(true)}})});
var keys={};
window.addEventListener('keydown',function(e){if(e.target.closest&&e.target.closest('input,textarea,dialog'))return;
  if((e.ctrlKey||e.metaKey)&&e.key.toLowerCase()==='z'){e.preventDefault();undo();return}
  if(e.key==='Escape'){if(chain||roomA){chain=null;roomA=null;showPrevWall([]);lenLabel(null);return}if(focusId){exitFocus();return}if(tool!=='select')setTool('select');return}
  if(!focusId){var m={v:'select',r:'room',w:'wall',d:'door',x:'erase'}[e.key.toLowerCase()];if(m&&!e.ctrlKey&&!e.metaKey){setTool(m);return}}
  keys[e.key.toLowerCase()]=true});
window.addEventListener('keyup',function(e){keys[e.key.toLowerCase()]=false});
window.addEventListener('blur',function(){keys={}});
function keyMove(){var sp=DT*360;if(keys.arrowup)pan(0,sp);if(keys.arrowdown)pan(0,-sp);if(keys.arrowleft)pan(sp,0);if(keys.arrowright)pan(-sp,0);
  if(!focusId){if(keys.w)pan(0,sp);if(keys.s)pan(0,-sp);if(keys.a)pan(sp,0)}if(keys.q){cam.yaw+=DT*1.8;goal=null}if(keys.e){cam.yaw-=DT*1.8;goal=null}}

var toastT;function toast(s){var t=$('toast');t.textContent=s;t.classList.add('on');clearTimeout(toastT);toastT=setTimeout(function(){t.classList.remove('on')},2600)}

// ---------- start ----------
resize();rebuild();fit(false);setTool('select');if(preset){placeCamera();enterFocus(preset)}
if(DEMO&&!DEMO_STILL){(function(){var ids=B.doors.map(function(d){return d.id}),i=0;
  function w(ms,f){setTimeout(f,ms)}
  function step(){var id=ids[i%ids.length];i++;
    enterFocus(id);
    w(1800,function(){var r=RT[id];if(r)r.target=1;
      w(2800,function(){var r2=RT[id];if(r2)r2.target=0;
        w(1600,function(){exitFocus();w(3600,step)})})})}
  w(2600,step)})()}
var DT=0.016,lastT=performance.now();
(function loop(){
  var now=performance.now();DT=Math.min(0.1,(now-lastT)/1000);lastT=now;
  keyMove();
  Object.keys(RT).forEach(function(id){var r=RT[id];if(Math.abs(r.target-r.open)>0.001){r.open+=(r.target-r.open)*(1-Math.exp(-DT*3.2));r.lay(r.open);if(+id===focusId)syncOpenUI()}else if(r.open!==r.target){r.open=r.target;r.lay(r.open);if(+id===focusId)syncOpenUI()}});
  if(DEMO&&!DEMO_STILL&&!focusId&&!goal)cam.yaw+=DT*0.12;placeCamera();renderer.render(scene,camera);updateLabels(false);requestAnimationFrame(loop);
})();
window.__fd={B:function(){return B},cam:cam,enterFocus:enterFocus,exitFocus:exitFocus,setTool:setTool,RT:RT};
})();
</script>
